# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

previews:
  generation: off

services:
  - type: web
    name: queuewise-api
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    rootDir: backend
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev && npm run prisma:generate && npm run build
    preDeployCommand: npm run prisma:deploy
    startCommand: npm run start:prod
    healthCheckPath: /api/health/ready
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: API_PREFIX
        value: api
      - key: CORS_ORIGINS
        value: ""
      - key: DATABASE_URL
        fromDatabase:
          name: queuewise-postgres
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: PRIVACY_CONTACT_EMAIL
        sync: false

databases:
  - name: queuewise-postgres
    region: singapore
    plan: 0.1c-256mb
    postgresMajorVersion: "16"
    databaseName: queuewise
    user: queuewise
    ipAllowList: []

