name: Android release

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: Semantic app version, for example 1.0.0
        required: true
        default: 1.0.0
        type: string
      build_number:
        description: New Android version code; must increase for every Play upload
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-production-release
  cancel-in-progress: false

jobs:
  app-bundle:
    name: Signed Android app bundle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Android releases must be built from the main branch."
          exit 1

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze mobile app
        run: flutter analyze

      - name: Run mobile tests
        run: flutter test

      - name: Prepare protected release configuration
        run: dart run tool/prepare_android_release.dart
        env:
          BUILD_NAME: ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          PRODUCTION_API_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL }}
          PRODUCTION_SOCKET_URL: ${{ vars.PRODUCTION_SOCKET_URL }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}

      - name: Build signed app bundle
        run: >-
          flutter build appbundle --release
          --build-name="$BUILD_NAME"
          --build-number="$BUILD_NUMBER"
          --dart-define-from-file=.env.production
        env:
          BUILD_NAME: ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Create bundle checksum
        run: >-
          sha256sum build/app/outputs/bundle/release/app-release.aab
          > build/app/outputs/bundle/release/app-release.aab.sha256

      - name: Upload signed app bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: queuewise-android-${{ inputs.build_name }}-${{ inputs.build_number }}
          path: |
            mobile/build/app/outputs/bundle/release/app-release.aab
            mobile/build/app/outputs/bundle/release/app-release.aab.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary release credentials
        if: always()
        run: |
          rm -f android/app/upload-keystore.jks
          rm -f android/app/google-services.json
          rm -f android/key.properties
          rm -f .env.production
