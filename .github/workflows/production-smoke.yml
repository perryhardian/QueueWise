name: Production smoke test

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Public API base URL, including the API prefix
        required: true
        type: string
      socket_base_url:
        description: Public Socket.IO origin
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  verify:
    name: Verify production deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify production endpoints
        run: node backend/scripts/verify-deployment.mjs
        env:
          QUEUEWISE_API_URL: ${{ inputs.api_base_url }}
          QUEUEWISE_SOCKET_URL: ${{ inputs.socket_base_url }}

